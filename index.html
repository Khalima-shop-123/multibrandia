<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MULTIBRANDIA — часы и украшения со всего мира</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="products.js"></script>
<script src="mathey.js"></script>
<style>
  :root{--ink:#111;--wine:#6b1220;--grey:#8a8a8a;--line:#e8e4de;--bg:#fdfcfb}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);padding-bottom:80px}
  header{position:sticky;top:0;background:rgba(253,252,251,.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .logo{font-family:Georgia,serif;font-size:20px;letter-spacing:6px}
  .logo span{color:var(--wine)}
  #cartBtn{position:relative;background:none;border:1px solid var(--ink);border-radius:20px;
    padding:8px 14px;font-size:13px;letter-spacing:1px;cursor:pointer}
  #cartCount{position:absolute;top:-6px;right:-6px;background:var(--wine);color:#fff;border-radius:50%;
    width:20px;height:20px;font-size:11px;display:none;align-items:center;justify-content:center}
  .search{padding:12px 16px 0}
  .showcase{display:block;padding:0 16px 16px}
  .bcard{position:relative;height:180px;border-radius:12px;overflow:hidden;cursor:pointer;margin-bottom:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.12)}
  .bcard img{width:100%;height:100%;object-fit:cover;display:block}
  .bover{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
  .bname{position:absolute;left:16px;bottom:12px;color:#fff;font-family:Georgia,serif;font-size:22px;
    letter-spacing:4px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .bcount{position:absolute;left:16px;bottom:2px;color:rgba(255,255,255,.85);font-size:11px;letter-spacing:1px}
  .bsale{position:absolute;top:12px;right:12px;background:var(--wine);color:#fff;font-size:12px;
    font-weight:700;letter-spacing:1px;padding:6px 12px;border-radius:3px}
  .search input{width:100%;padding:12px 16px 12px 40px;border:1px solid var(--line);border-radius:22px;
    font-size:14px;background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%238a8a8a" viewBox="0 0 16 16"><path d="M11.7 10.3a6.5 6.5 0 1 0-1.4 1.4l3 3 1-1-2.6-2.4zM6.5 11a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>') no-repeat 14px center}
  .tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
  .tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-size:13px;
    white-space:nowrap;cursor:pointer}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 16px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  .group-h{grid-column:1/-1;font-family:Georgia,serif;font-size:17px;letter-spacing:4px;
    padding:18px 0 2px;border-bottom:1px solid var(--ink);margin-top:6px}
  .group-h small{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1px;color:var(--grey);margin-left:8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
  .card.na img{opacity:.4}
  .card.na h3{color:var(--grey)}
  .card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .card .info{padding:10px 12px 14px}
  .card h3{font-size:13px;font-weight:600;margin-bottom:6px;min-height:32px}
  .price{font-size:15px;font-weight:700}
  .old{font-size:12px;color:var(--grey);text-decoration:line-through;margin-left:6px}
  .badge{display:inline-block;font-size:10px;letter-spacing:1px;color:#fff;background:var(--wine);
    padding:3px 7px;border-radius:2px;margin-bottom:6px}
  .badge.out{background:var(--grey)}
  #productView,#cartView{display:none}
  .back{padding:14px 16px;font-size:13px;color:var(--grey);cursor:pointer;letter-spacing:1px}
  .carousel{position:relative;width:100%;aspect-ratio:1;background:#fff;overflow:hidden}
  .carousel img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .25s}
  .carousel img.on{opacity:1}
  .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center}
  .dots i{width:6px;height:6px;border-radius:50%;background:#c9c4bd}
  .dots i.on{background:var(--ink)}
  .pinfo{padding:18px 20px}
  .pinfo h2{font-family:Georgia,serif;font-size:22px;margin:8px 0}
  .pinfo .price{font-size:22px}
  .btn{display:block;width:100%;padding:16px;background:var(--ink);color:#fff;border:none;font-size:14px;
    letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:2px;margin-top:8px}
  .btn.wine{background:var(--wine)}
  .btn:disabled{background:var(--grey)}
  .citem{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}
  .citem img{width:72px;height:72px;object-fit:cover;border-radius:3px}
  .citem .nm{flex:1;font-size:13px;font-weight:600}
  .qty{display:flex;align-items:center;gap:10px;margin-top:8px}
  .qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:16px;cursor:pointer}
  #cartTotal{padding:16px;font-size:18px;font-weight:700;display:flex;justify-content:space-between}
  .empty{text-align:center;color:var(--grey);padding:60px 0;font-size:14px;letter-spacing:1px;grid-column:1/-1}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50}
  #orderForm{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:12px 12px 0 0;
    padding:22px 20px 30px;display:none;z-index:51}
  #orderForm input{width:100%;padding:14px;border:1px solid var(--line);border-radius:4px;margin-bottom:12px;font-size:15px}
  #orderForm h3{font-family:Georgia,serif;margin-bottom:16px}
  .paytotal{font-size:17px;font-weight:700;margin-bottom:12px}
  .paynote{font-size:12px;color:var(--grey);margin:10px 0 14px;line-height:1.5}
  .variants{padding:4px 16px 24px}
  .pinfo .variants{padding:6px 0 14px}
  .variants h4{font-family:Georgia,serif;font-size:13px;letter-spacing:2px;margin-bottom:10px;color:var(--ink)}
  .vrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .vcard{flex:0 0 104px;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
  .vcard.na img{opacity:.4}
  .vcard img{width:104px;height:104px;object-fit:cover;display:block}
  .vcard p{font-size:10px;padding:6px 7px;margin:0;line-height:1.35;color:var(--ink)}
  .vcard .price{display:block;font-size:11px;font-weight:700;margin-top:3px}
  .sizelabel{font-size:12px;letter-spacing:2px;margin-bottom:8px;color:var(--grey)}
  .colorrow{display:flex;align-items:center;gap:9px;margin:14px 0 2px}
  .colorrow .cl{font-size:12px;letter-spacing:2px;color:var(--grey);margin-right:2px}
  .sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);cursor:pointer;display:inline-block}
  .sw.on{outline:2px solid var(--ink);outline-offset:2px}
  .field{width:100%;padding:14px;border:1px solid var(--line);border-radius:4px;margin-bottom:12px;font-size:15px;background:#fff}
  .sumline{display:flex;justify-content:space-between;padding:10px 16px;font-size:14px;color:var(--grey)}
  .payrow{display:flex;gap:10px;padding:10px 16px 0}
  .payrow .btn{flex:1;font-size:12px;letter-spacing:1px;padding:15px 8px}
  .payrow small{display:block;font-weight:400;font-size:10px;letter-spacing:0;margin-top:4px;opacity:.85}
  .sumtotal{display:flex;justify-content:space-between;padding:14px 16px;font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px}
  .suggest{padding:4px 16px 16px}
  .suggest h4{font-family:Georgia,serif;font-size:13px;letter-spacing:2px;margin-bottom:10px}
  .srow2{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px}
  .srow2 img{width:72px;height:72px;object-fit:cover;border-radius:3px}
  .srow2 .nm{flex:1;font-size:13px;font-weight:600}
  .splus{width:36px;height:36px;border:1px solid var(--ink);background:#fff;border-radius:50%;font-size:18px;cursor:pointer}
  .sizebtn{flex:1;padding:13px;border:1px solid var(--ink);background:#fff;font-size:13px;letter-spacing:2px;cursor:pointer;border-radius:2px}
  .sizebtn.active{background:var(--ink);color:#fff}
  .vplus{display:block;width:100%;border:none;border-top:1px solid var(--line);background:var(--bg);padding:8px;font-size:17px;cursor:pointer;color:var(--ink)}
  .vplus:disabled{color:var(--grey)}
</style>
</head>
<body>
<header>
  <div class="logo">MULTI<span>BRANDIA</span></div>
  <button id="cartBtn" onclick="showCart()">КОРЗИНА<span id="cartCount">0</span></button>
</header>

<div class="search">
  <input id="searchInput" type="search" placeholder="Поиск: Diana, Sophie, Ava…">
</div>

<div class="tabs" id="brandTabs"></div>
<div class="tabs" id="tabs">
  <button class="tab active" data-f="all">Все</button>
  <button class="tab" data-f="Watch">Часы</button>
  <button class="tab" data-f="Jewelry">Украшения</button>
  <button class="tab" data-f="sale">Sale</button>
</div>

<div id="catalogView"><div class="showcase" id="showcase"></div><div class="grid" id="grid"></div></div>

<div id="productView">
  <div class="back" onclick="showCatalog()">← НАЗАД К КАТАЛОГУ</div>
  <div class="carousel" id="car"></div>
  <div class="pinfo">
    <span class="badge" id="pvBadge"></span>
    <h2 id="pvTitle"></h2>
    <div><span class="price" id="pvPrice"></span><span class="old" id="pvOld"></span></div>
    <div id="sizeRow"></div>
    <div class="colorrow" id="colorRow"></div>
    <div class="variants" id="variants"></div>
    <button class="btn" id="pvBtn"></button>
  </div>
  <div class="variants" id="complete"></div>
</div>

<div id="cartView">
  <div class="back" onclick="showCatalog()">← НАЗАД К КАТАЛОГУ</div>
  <div id="cartItems"></div>
  <div class="suggest" id="suggest"></div>
  <div id="cartTotal"></div>
  <div style="padding:0 16px"><button class="btn wine" id="checkoutBtn" onclick="showCheckout()">ОФОРМИТЬ ЗАКАЗ</button></div>
</div>

<div id="checkoutView">
  <div class="back" onclick="showCart()">← КОРЗИНА</div>
  <div class="pinfo">
    <h2>Данные доставки</h2>
    <input class="field" id="cFio" placeholder="Фамилия Имя Отчество">
    <input class="field" id="cPhone" placeholder="Телефон">
    <input class="field" id="cCity" placeholder="Город">
    <input class="field" id="cSdek" placeholder="Адрес пункта выдачи СДЭК">
    <button class="btn" onclick="goSummary()">ДАЛЕЕ →</button>
  </div>
</div>

<div id="summaryView">
  <div class="back" onclick="goCheckout()">← НАЗАД</div>
  <div id="sumItems"></div>
  <div class="sumline"><span>Товары</span><span id="sumSub"></span></div>
  <div class="sumline"><span>Доставка СДЭК</span><span id="sumDel"></span></div>
  <div class="sumtotal"><span>ИТОГО К ОПЛАТЕ</span><span id="sumTotal"></span></div>
    <div class="payrow">
    <div class="btn wine" style="opacity:.55">ОПЛАТИТЬ ПОЛНОСТЬЮ<br><small id="fullBtn"></small></div>
    <div class="btn wine" style="opacity:.55">ОПЛАТИТЬ 50%<br><small id="halfBtn"></small></div>
  </div>
  <div style="padding:0 16px 10px;font-size:13px;color:#8a7563;text-align:center">
    💳 Реквизиты для оплаты пришлём вам в чат сразу после оформления заказа
  </div>
  <div style="padding:10px 16px 0">
    <button class="btn" onclick="sendReceipt()">📸 ОТПРАВИТЬ ЧЕК ОБ ОПЛАТЕ</button>
  </div>
  <div style="padding:10px 16px 0">
    
  </div>
  
</div>



<script>
const MT_DELIVERY = 1800; // доставка СДЭК Форвард за 1 часы MATHEY-TISSOT из США, \u20bd \u2014 уточните свой тариф\n// округление цен вверх до сотен: 1566 -> 1600
PRODUCTS.forEach(p => { p.price_rub = Math.ceil(p.price_rub/100)*100; if (p.old_rub) p.old_rub = Math.ceil(p.old_rub/100)*100; });
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
const GS_URL = 'https://script.google.com/macros/s/AKfycbzo46iASNTVBe395oDI4Fi6kA8AdvRQ_1w16FmuK6ih44DFjZkTZvitbU9KUJxtpylb/exec';
let cart = JSON.parse(localStorage.getItem('burker_cart') || '{}');
// подключаем ручные бренды (mathey.js и др.)
if (typeof MATHEY !== 'undefined') PRODUCTS.push(...MATHEY);
// чистим позиции, которых больше нет в каталоге (после обновления выгрузки)
Object.keys(cart).forEach(id=>{ if(!PRODUCTS.find(x=>x.id==id)) delete cart[id]; });
let filter = 'all', query = '', cur = null, brand = 'all', payMode = 'full';

function saveCart(){ localStorage.setItem('burker_cart', JSON.stringify(cart)); updateBadge(); }
function cartQty(){ return Object.values(cart).reduce((a,b)=>a+b, 0); }
function updateBadge(){
  const c = document.getElementById('cartCount');
  c.style.display = cartQty() ? 'flex' : 'none'; c.textContent = cartQty();
}
const modelOf = p => p.title.split(' ')[0].toUpperCase();
const COLORS = ['burgundy','gold','silver','black','blue','green','white','rose','brown','grey'];
const colorTokens = t => COLORS.filter(c => t.toLowerCase().includes(c));
const colorKeyOf = p => p.title.toLowerCase().split(/\s+/).slice(1).filter(w=>w!=='petite').join(' ');
const COLOR_HEX={gold:'#c9a24b',silver:'#b9bcc2',burgundy:'#6b1220',black:'#1a1a1a',blue:'#3b5b8c',green:'#5a7d4f',white:'#e8e6e1',rose:'#c98a8a',brown:'#7a5c3e',grey:'#9a9a9a'};
const mainColor=t=>COLORS.find(c=>t.toLowerCase().includes(c))||null;
const kindKeyOf=p=>p.title.toLowerCase().split(/\s+/).filter(w=>w!=='petite'&&!COLORS.includes(w)).join(' ');
function quickAdd(id,btn){ cart[id]=(cart[id]||0)+1; saveCart(); if(btn){btn.textContent='\u2713'; btn.disabled=true;} }
// в наличии — выше, нет в наличии — внизу списка
const sortAvail = list => [...list].sort((a,b)=>(b.available?1:0)-(a.available?1:0));
const brandOf = p => p.brand || 'BURKER';
const filtered = () => PRODUCTS.filter(p =>
  (brand==='all' || brandOf(p)===brand) &&
  (filter==='all' ? true : filter==='sale' ? p.sale : p.type===filter));
function renderBrandTabs(){
  const brands=[...new Set(PRODUCTS.map(brandOf))].sort();
  const bt=document.getElementById('brandTabs');
  bt.innerHTML=`<button class="tab active" data-b="all">Все бренды</button>`
    + brands.map(b=>`<button class="tab" data-b="${b}">${b.toUpperCase()}</button>`).join('');
}
document.getElementById('brandTabs').onclick=e=>{
  if(!e.target.dataset.b) return;
  brand=e.target.dataset.b;
  document.querySelectorAll('#brandTabs .tab').forEach(t=>t.classList.toggle('active',t===e.target));
  render();
};

function cardHTML(p){
  const d = document.createElement('div');
  d.className = 'card' + (p.available ? '' : ' na');
  d.onclick = ()=>openProduct(p.id);
  d.innerHTML = `<img loading="lazy" src="${p.images[0]}" alt="">
    <div class="info">
      ${p.sale?'<span class="badge">SALE</span>':''}${!p.available?'<span class="badge out">НЕТ В НАЛИЧИИ</span>':''}
      <h3>${p.title}</h3>
      <span class="price">${fmt(p.price_rub)}</span>
      ${p.old_rub?`<span class="old">${fmt(p.old_rub)}</span>`:''}
    </div>`;
  return d;
}

function renderShowcase(){
  const sc=document.getElementById('showcase');
  if(brand!=='all' || query.trim()){ sc.style.display='none'; return; }
  sc.style.display='block';
  const brands=[...new Set(PRODUCTS.map(brandOf))].sort();
  sc.innerHTML=brands.map(b=>{
    const items=PRODUCTS.filter(p=>brandOf(p)===b);
    let src='';
    if(b==='BURKER'){ src='banner-burker.jpg'; }
    else {
      const hero=items.find(p=>p.available&&p.images.length)||items[0]||{};
      src=(hero.images&&hero.images.length)?hero.images[0]:'';
    }
    let maxd=0;
    items.forEach(p=>{ if(p.old_rub){ const d=Math.round((1-p.price_rub/p.old_rub)*100); if(d>maxd)maxd=d; } });
    const avail=items.filter(p=>p.available).length;
    return `<div class="bcard" onclick="pickBrand('${b}')">
      <img src="${src}" loading="lazy">
      <div class="bover"></div>
      <div class="bname">${b}</div>
      <div class="bcount">${avail} товаров в наличии</div>
      ${maxd>0?`<div class="bsale">SALE до &minus;${maxd}%</div>`:''}
    </div>`;
  }).join('');
}
function pickBrand(b){
  brand=b;
  document.querySelectorAll('#brandTabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.b===b));
  render(); window.scrollTo(0,0);
}
function render(){
  renderShowcase();
  const g = document.getElementById('grid'); g.innerHTML='';
  const q = query.trim().toLowerCase();
  let list = filtered().filter(p => !q || p.title.toLowerCase().includes(q));

  if(q){
    // режим поиска: плоский список, в наличии выше
    sortAvail(list).forEach(p => g.appendChild(cardHTML(p)));
  } else {
    // обычный режим: группы по моделям, внутри — в наличии выше
    const groups = {};
    sortAvail(list).forEach(p => { const m = modelOf(p); (groups[m]=groups[m]||[]).push(p); });
    Object.keys(groups).sort().forEach(m => {
      const h = document.createElement('div'); h.className = 'group-h';
      h.innerHTML = `${m}<small>${groups[m].length}</small>`;
      g.appendChild(h);
      groups[m].forEach(p => g.appendChild(cardHTML(p)));
    });
  }
  if(!g.children.length) g.innerHTML='<div class="empty">НИЧЕГО НЕ НАЙДЕНО</div>';
}

document.getElementById('searchInput').addEventListener('input', e => {
  query = e.target.value; render();
});
document.getElementById('tabs').onclick = e=>{
  if(!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===e.target));
  render();
};
function show(view){
  ['catalogView','productView','cartView','checkoutView','summaryView'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById(view).style.display='block'; window.scrollTo(0,0);
}
const showCatalog = ()=>show('catalogView');

function openProduct(id){
  cur = PRODUCTS.find(p=>p.id===id);
  const car = document.getElementById('car');
  car.innerHTML = cur.images.map((s,i)=>`<img src="${s}" class="${i?'':'on'}">`).join('')
    + `<div class="dots">${cur.images.map((_,j)=>`<i class="${j?'':'on'}"></i>`).join('')}</div>`;
  car.onclick = ()=>{
    const imgs=[...car.querySelectorAll('img')], dots=[...car.querySelectorAll('.dots i')];
    let i = imgs.findIndex(x=>x.classList.contains('on'));
    i = (i+1) % imgs.length;
    imgs.forEach((x,k)=>x.classList.toggle('on',k===i));
    dots.forEach((x,k)=>x.classList.toggle('on',k===i));
  };
  document.getElementById('pvTitle').textContent = cur.title;
  document.getElementById('pvPrice').textContent = fmt(cur.price_rub);
  document.getElementById('pvOld').textContent = cur.old_rub ? fmt(cur.old_rub) : '';
  document.getElementById('pvBadge').textContent = cur.sale ? 'SALE' : '';
  const btn = document.getElementById('pvBtn');
  if(!cur.available){ btn.textContent='НЕТ В НАЛИЧИИ'; btn.disabled=true; btn.onclick=null; }
  else if(cart[cur.id]){ btn.textContent='В КОРЗИНЕ ✓'; btn.disabled=false; btn.onclick=showCart; }
  else { btn.textContent='ДОБАВИТЬ В КОРЗИНУ'; btn.disabled=false;
    btn.onclick=()=>{ cart[cur.id]=1; saveCart(); openProduct(cur.id); }; }
  // ЦВЕТ: только украшения, только та же категория изделия (колье<->колье, браслет<->браслет)
  const crow=document.getElementById('colorRow'); crow.innerHTML='';
  if(cur.type==='Jewelry'){
    const isP=cur.title.toLowerCase().includes('petite');
    const sibs=PRODUCTS.filter(p=>p.id!==cur.id && p.type==='Jewelry'
        && kindKeyOf(p)===kindKeyOf(cur)
        && p.title.toLowerCase().includes('petite')===isP
        && colorKeyOf(p)!==colorKeyOf(cur));
    if(sibs.length){
      const items=[cur].concat(sibs);
      crow.innerHTML='<span class="cl">ЦВЕТ:</span>'+items.map((p,i)=>{
        const c=mainColor(p.title);
        return `<span class="sw${i===0?' on':''}" style="background:${c?COLOR_HEX[c]:'#ddd'}" onclick="openProduct(${p.id})"></span>`;
      }).join('');
    }
  }
  // РАЗМЕР: NORMAL / PETITE (если у этой расцветки есть версия другого размера)
  const srow = document.getElementById('sizeRow'); srow.innerHTML='';
  if(cur.type==='Watch'){
    const ck = colorKeyOf(cur);
    const sib = PRODUCTS.find(p => p.type==='Watch' && p.id!==cur.id
                                 && modelOf(p)===modelOf(cur) && colorKeyOf(p)===ck);
    if(sib){
      const isP = cur.title.toLowerCase().includes('petite');
      srow.innerHTML = `<div class="sizelabel">РАЗМЕР</div><div style="display:flex;gap:10px">`
        + `<button class="sizebtn${isP?'':' active'}" onclick="openProduct(${isP?sib.id:cur.id})">NORMAL</button>`
        + `<button class="sizebtn${isP?' active':''}" onclick="openProduct(${isP?cur.id:sib.id})">PETITE</button></div>`;
    }
  }
  // ЗАВЕРШИТЕ ОБРАЗ: браслеты в тон (бордовый циферблат -> бордовый браслет)
  const cbox = document.getElementById('complete'); cbox.innerHTML='';
  if(cur.type==='Watch'){
    const toks = colorTokens(cur.title);
    const sugg = PRODUCTS.filter(p=>p.type==='Jewelry' && p.id!==cur.id)
      .map(p=>({p, s: colorTokens(p.title).filter(c=>toks.includes(c)).length}))
      .sort((a,b)=>(b.p.available?1:0)-(a.p.available?1:0) || b.s-a.s)
      .slice(0,4).map(x=>x.p);
    if(sugg.length){
      cbox.innerHTML = `<h4>\u0417\u0410\u0412\u0415\u0420\u0428\u0418\u0422\u0415 \u041e\u0411\u0420\u0410\u0417</h4><div class="vrow">`
        + sugg.map(p=>`<div class="vcard${p.available?'':' na'}">
             <img src="${p.images[0]}" loading="lazy" onclick="openProduct(${p.id})">
             <p>${p.title}<span class="price">${fmt(p.price_rub)}</span></p>
             ${p.available?`<button class="vplus" onclick="quickAdd(${p.id},this)">+</button>`:''}
           </div>`).join('') + `</div>`;
    }
  }
  // "другие варианты": только часы, та же модель и тот же размер (Petite<->Petite, Normal<->Normal)
  const m = modelOf(cur);
  const isPetite = cur.title.toLowerCase().includes('petite');
  const vs = cur.type==='Watch'
    ? sortAvail(PRODUCTS.filter(p => modelOf(p)===m && p.id!==cur.id
        && p.title.toLowerCase().includes('petite')===isPetite))
    : [];
  const vbox = document.getElementById('variants');
  if(vs.length){
    vbox.innerHTML = `<h4>ДРУГИЕ ВАРИАНТЫ: ${m}</h4><div class="vrow">` + vs.map(p=>
      `<div class="vcard${p.available?'':' na'}" onclick="openProduct(${p.id})">
         <img src="${p.images[0]}" loading="lazy">
         <p>${p.title.replace(new RegExp('^'+m+'\\s*'),'')||p.title}<span class="price">${fmt(p.price_rub)}</span></p>
       </div>`).join('') + `</div>`;
  } else { vbox.innerHTML=''; }
  show('productView');
}

function cartList(){
  return Object.entries(cart).map(([id,qty])=>({p:PRODUCTS.find(x=>x.id==id), qty})).filter(x=>x.p);
}
function cartSubtotal(){ return cartList().reduce((s,x)=>s+x.p.price_rub*x.qty,0); }
function deliveryCalc(){
  let w=0, j=0, mt=0;
  cartList().forEach(({p,qty})=>{
    if(brandOf(p)==='MATHEY-TISSOT') mt+=qty;
    else if(p.type==='Watch') w+=qty; else j+=qty;
  });
  const mtCost = mt*MT_DELIVERY;
  if(w===0 && mt===0){
    // только украшения: первые 6 входят в базовую доставку
    return 1300 + 400*Math.max(0, j-6);
  }
  // есть часы: каждая следующая пара +800, каждое украшение +400
  return 1300 + 800*Math.max(0, w-1) + 400*j + mtCost;
}
function cartSuggest(){
  if(!cartQty()) return null;
  const inCart=Object.keys(cart).map(Number);
  const toks=[];
  cartList().forEach(({p})=>colorTokens(p.title).forEach(c=>{if(!toks.includes(c))toks.push(c);}));
  const cands=PRODUCTS.filter(p=>p.type==='Jewelry'&&p.available&&!inCart.includes(p.id))
    .map(p=>({p, s:colorTokens(p.title).filter(c=>toks.includes(c)).length}))
    .sort((a,b)=>b.s-a.s || a.p.price_rub-b.p.price_rub);
  return cands.length?cands[0].p:null;
}
function showCart(){
  const box=document.getElementById('cartItems'); box.innerHTML='';
  cartList().forEach(({p,qty})=>{
    const d=document.createElement('div'); d.className='citem';
    d.innerHTML=`<img src="${p.images[0]}"><div class="nm">${p.title}
      <div class="price" style="font-size:14px">${fmt(p.price_rub*qty)}</div>
      <div class="qty"><button onclick="chQty(${p.id},-1)">−</button><span>${qty}</span>
      <button onclick="chQty(${p.id},1)">+</button></div></div>`;
    box.appendChild(d);
  });
  const sg=document.getElementById('suggest'); sg.innerHTML='';
  const sug=cartSuggest();
  if(sug){
    sg.innerHTML=`<h4>ДОБАВЬТЕ К ЗАКАЗУ</h4><div class="srow2">
      <img src="${sug.images[0]}" onclick="openProduct(${sug.id})">
      <div class="nm">${sug.title}<div class="price" style="font-size:13px">${fmt(sug.price_rub)}</div></div>
      <button class="splus" onclick="quickAdd(${sug.id});showCart()">+</button></div>`;
  }
  const sub=cartSubtotal();
  document.getElementById('cartTotal').innerHTML = sub
    ? `<span>ТОВАРЫ</span><span>${fmt(sub)}</span>` : '';
  document.getElementById('checkoutBtn').style.display = sub ? 'block' : 'none';
  show('cartView');
}
function chQty(id,d){ cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; saveCart(); showCart(); }

function gv(id){ return document.getElementById(id).value.trim(); }
function showCheckout(){
  if(!cartQty()) return;
  show('checkoutView');
}
function goCheckout(){ show('checkoutView'); }
function goSummary(){
  if(!gv('cFio')||!gv('cPhone')||!gv('cCity')||!gv('cSdek')){ tg.showAlert('Заполните все поля'); return; }
  renderSummary();
  show('summaryView');
}
function renderSummary(){
  const box=document.getElementById('sumItems'); box.innerHTML='';

  const sub=cartSubtotal(), del=deliveryCalc(), total=sub+del;
  const hasMT = cartList().some(x=>brandOf(x.p)==='MATHEY-TISSOT');
  const restPoint = hasMT ? 'складе в Америке' : 'складе в Европе';
  document.getElementById('sumSub').textContent=fmt(sub);
  document.getElementById('sumDel').textContent=fmt(del);
  document.getElementById('sumTotal').textContent=fmt(total);
  document.getElementById('fullBtn').textContent = 'Полная сумма ' + fmt(total);
  document.getElementById('halfBtn').textContent = fmt(Math.ceil(total/2)) + ' сейчас · остальное при получении на ' + restPoint;
}
let orderSent = false;
function sendOrderOnce(){
  if(orderSent) return true;
  orderSent = true;
  const sub=cartSubtotal(), del=deliveryCalc(), total=sub+del;
  const items=cartList().map(({p,qty})=>`${p.title} \u00d7${qty} \u2014 ${fmt(p.price_rub*qty)}`);
  const rest = payMode==='half' ? Math.ceil(total/2) : 0;
  const payload = {fio:gv('cFio'),phone:gv('cPhone'),city:gv('cCity'),sdek:gv('cSdek'),
    items, subtotal:fmt(sub), delivery:fmt(del), total:fmt(total),
    pay:payMode, rest:fmt(rest)};
  // 1. \u0412 Google \u0422\u0430\u0431\u043b\u0438\u0446\u0443 \u2014 \u0412\u0421\u0415\u0413\u0414\u0410
  try {
    fetch(GS_URL, {method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)});
  } catch(e) {}
  // 2. Уведомление о заказе шлёт Google Apps Script (GS_URL): пишет в таблицу + отправляет заказ в бот
  cart={}; saveCart();
  return true;
}

function sendReceipt(){
  sendOrderOnce();
  tg.openLink('https://t.me/shamsuevah');
}
renderBrandTabs(); render(); updateBadge();
